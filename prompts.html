<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PromptNova</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
<h1>🚀 PromptNova</h1>
<p>Best AI Prompts Collection</p>
</header>

<div class="container">
  <input
  type="text"
  id="search"
  placeholder="🔍 Search AI Prompts..."
  style="width:100%;padding:12px;border-radius:8px;border:none;margin-bottom:20px;font-size:16px;">

<div class="card" data-category="youtube">
<h2>YouTube Script Prompt</h2>

<p id="p1">
Write a viral YouTube Shorts script about motivation in under 60 seconds with a strong hook and emotional ending.
</p>

<button onclick="copyPrompt('p1')">
Copy Prompt
</button>

</div>

<div class="card" data-category="logo">
<h2>Logo Design Prompt</h2>

<p id="p2">
Create a premium futuristic logo for an AI brand named PromptNova with neon blue colors.
</p>

<button onclick="copyPrompt('p2')">
Copy Prompt
</button>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
<div class="categories">
  <button class="cat-btn">All</button>
  <button class="cat-btn">ChatGPT</button>
  <button class="cat-btn">YouTube</button>
  <button class="cat-btn">Logo</button>
  <button class="cat-btn">Coding</button>
</div>
